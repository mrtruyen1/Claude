# Theme "Flux Glass" cho dashboard flux-mobile.
# ĐÃ THÊM VÀO: /homeassistant/themes/smarthome_neon_dark.yaml (append) trên HA VM101
#   (vì file theme MỚI không được !include_dir_merge_named nạp lại nếu không restart;
#    append vào file đã include + gọi service frontend.reload_themes thì nạp được ngay).
# Backup file gốc: /homeassistant/themes/smarthome_neon_dark.yaml.bak-20260703
# Kích hoạt: mỗi view trong flux-mobile đặt  theme: "Flux Glass"  (không đổi default toàn cục).
Flux Glass:
