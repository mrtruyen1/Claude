SmartHome Neon Dark:
  # ===== Card-mod: thanh tab kiểu pill nút tròn + icon 3D =====
  card-mod-theme: SmartHome Neon Dark
  card-mod-root-yaml: |
    ".": |
      /* Thanh tab: chiếm hết vùng giữa menu và nút ba chấm, các icon tự dàn đều theo màn hình */
      app-toolbar {
        column-gap: 0 !important;
      }
      app-toolbar ha-tab-group,
      ha-tab-group {
        background: transparent !important;
        border: 0 !important;
        border-radius: 0 !important;
        padding: 7px 8px 4px !important;
        margin: 7px 0 2px !important;
        box-shadow: none !important;
        min-height: 0 !important;
        flex: 1 1 auto !important;
        width: calc(100vw - 112px) !important;
        max-width: calc(100vw - 112px) !important;
        min-width: 0 !important;
        --ha-tab-active-text-color: transparent;
      }
      /* Mỗi tab: nền tắt giống tile cửa đóng, tab đang chọn chuyển vàng */
      ha-tab-group-tab {
        opacity: 1 !important;
        margin: 0 1px !important;
        width: clamp(45px, 11.6vw, 56px) !important;
        height: clamp(45px, 11.6vw, 56px) !important;
        min-width: clamp(45px, 11.6vw, 56px) !important;
        border-radius: 16px !important;
        background: rgba(20,13,45,0.45) !important;
        border: 1.5px solid rgba(25,199,230,0.86) !important;
        box-shadow: 0 0 17px rgba(25,199,230,0.32) !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }
      ha-tab-group-tab[active],
      ha-tab-group-tab[aria-selected=true] {
        background: linear-gradient(145deg, rgba(255,190,54,0.56), rgba(210,126,18,0.38)) !important;
        border-color: rgba(218,142,0,0.95) !important;
        box-shadow: 0 0 14px rgba(218,142,0,0.34), inset 0 0 0 1px rgba(255,225,120,0.12) !important;
      }
    "ha-tab-group$": |
      [part~="nav"] {
        border: 0 !important;
        display: flex !important;
        width: 100% !important;
      }
      [part~="tabs"] {
        display: flex !important;
        justify-content: space-evenly !important;
        gap: 2px !important;
        align-items: center !important;
        width: 100% !important;
        flex: 1 1 auto !important;
      }
      [part~="active-tab-indicator"] { display: none !important; }
    "ha-tab-group-tab$": |
      [part~="base"] {
        background: transparent !important;
        border: 0 !important;
        padding: 0 !important;
        min-height: 0 !important;
        height: 100% !important;
        width: 100% !important;
        border-radius: 16px !important;
        position: relative !important;
        justify-content: center !important;
        align-items: center !important;
      }
      ::slotted(*) { display: none !important; }
      [part~="base"]::before {
        content: "";
        position: absolute;
        inset: 1px;
        transform: translateY(3px);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 88%;
        pointer-events: none;
      }
      /* Bộ icon tab v3 — SVG chrome-neon, badge số nướng sẵn trong icon T1/T2/T3 */
      :host([panel="0"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/home_tab3d_off.svg?v=tabv3_1"); }
      :host([panel="0"][active]) [part~="base"]::before,
      :host([panel="0"][aria-selected="true"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/home_tab3d_on.svg?v=tabv3_1"); }
      :host([panel="1"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/bed_tab3d_off.svg?v=tabv3_1"); }
      :host([panel="1"][active]) [part~="base"]::before,
      :host([panel="1"][aria-selected="true"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/bed_tab3d_on.svg?v=tabv3_1"); }
      :host([panel="2"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t1_tab3d_off.svg?v=tabv3_1"); }
      :host([panel="2"][active]) [part~="base"]::before,
      :host([panel="2"][aria-selected="true"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t1_tab3d_on.svg?v=tabv3_1"); }
      :host([panel="3"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t2_tab3d_off.svg?v=tabv3_1"); }
      :host([panel="3"][active]) [part~="base"]::before,
      :host([panel="3"][aria-selected="true"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t2_tab3d_on.svg?v=tabv3_1"); }
      :host([panel="4"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t3_tab3d_off.svg?v=tabv3_1"); }
      :host([panel="4"][active]) [part~="base"]::before,
      :host([panel="4"][aria-selected="true"]) [part~="base"]::before { background-image: url("/local/tiles_tabs_v3/t3_tab3d_on.svg?v=tabv3_1"); }

